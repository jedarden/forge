[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Team collaboration and multi-user session support for FORGE"

[dependencies]
forge-core = { path = "../forge-core" }
forge-config = { path = "../forge-config" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = "0.26"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP server
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# TLS support
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2.2"
rustls = { version = "0.23", features = ["std", "ring"] }
x509-parser = "0.16"
base64 = "0.22"

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = { workspace = true }

# Async utilities
futures-util = { workspace = true }
async-trait = { workspace = true }

# HTTP client for OAuth token validation
reqwest = { version = "0.12", features = ["json"] }

# Serialization for OAuth config
serde_yaml = "0.9"

# Random for cache cleanup
rand = "0.8"

# Certificate generation
rcgen = "0.13"
time = "0.3"

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
time = "0.3"
